  <g id="text_17">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(76.752 349.530742)">Точка — медиана полных размахов циклов; отрезок — квартили 25 и 75 %.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(76.752 360.986484)">Дыхательная и ЭКГ-разметка кандидатные. Разные варианты ТТРКГ показаны отдельно.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(76.752 372.659375)">Пунктир соединяет наблюдения одного монтажа и служит ориентиром для чтения.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(76.752 384.332266)">При совпадении L маркеры разнесены по горизонтали; размеры в таблице номинальные.</text>
  </g>

  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .form-select {

  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

  }

  .form-control-color[type=&quot;color&quot;] {

  &lt;p class=&quot;lead-note&quot;&gt;Четыре модели контакта показаны раздельно. Широкая манжета остаётся поверхностным электродом, а плоскость-срез является самостоятельным идеализированным тестом расчётной модели.&lt;/p&gt;

        &lt;option value=&quot;point_disc_5mm&quot;&gt;Диск 5 мм&lt;/option&gt;

        &lt;option value=&quot;wide_cuff_equivalent_area&quot;&gt;Широкая манжета 15 мм&lt;/option&gt;
        &lt;option value=&quot;cross_section_plane&quot;&gt;Идеальная плоскость-срез&lt;/option&gt;
      &lt;/select&gt;

    &lt;span&gt;&lt;i data-role=&quot;V_plus&quot;&gt;&lt;/i&gt;V+&lt;/span&gt;

    &lt;div class=&quot;model-callout&quot;&gt;
      Рассчитывался полный объём тела с фоном из мягких тканей и отдельными масками лёгких, сердца целиком и кортикальной кости. Отдельной маски крови у Nix нет: параметр крови задан в конфигурации, но не назначен ни одному элементу сетки.

      &lt;/table&gt;

uot;y&quot;:24.9350042459528,&quot;z&quot;:-0.685270709556058,&quot;xmin&quot;:-246.54525224617,&quot;xmax&quot;:-244.353670894613,&quot;xcentroid&quot;:-245.432731274877,&quot;axialWidth&quot;:0.0,&quot;realisedArea&quot;:4454.79028658505,&quot;areaRatio&quot;:1.57555976566171,&quot;projectedArea&quot;:2867.22525859031,&quot;projectedAreaRatio&quot;:1.01407349525019},{&quot;key&quot;:&quot;40|100|cross_section_plane&quot;,&quot;kind&quot;:&quot;cross_section_plane&quot;,&quot;role&quot;:&quot;I_minus&quot;,&quot;x&quot;:-345.432495117188,&quot;y&quot;:24.9350042459528,&quot;z&quot;:-0.685270709556058,&quot;xmin&quot;:-346.514663298175,&quot;xmax&quot;:-344.374747859133,&quot;xcentroid&quot;:-345.428832486463,&quot;axialWidth&quot;:0.0,&quot;realisedArea&quot;:4541.61917871638,&quot;areaRatio&quot;:1.60626920429704,&quot;projectedArea&quot;:2865.47513655939,&quot;projectedAreaRatio&quot;:1.01345451620078}],&quot;contract&quot;:{&quot;status&quot;:&quot;model_test_not_experimental_validation&quot;,&quot;subject_id&quot;:&quot;nik&quot;,&quot;geometry_reference&quot;:&quot;CT/artificial-arm join plane&quot;,&quot;electrode_kinds&quot;:[&quot;circumferential_ring&quot;,&quot;cross_section_plane&quot;,&quot;point_disc_5mm&quot;,&quot;wide_cuff_equivalent_area&quot;],&quot;inner_distances_mm&quot;:[20,40],&quot;outer_distances_mm&quot;:[80,100],&quot;reciprocity_relative_tolerance&quot;:1e-08,&quot;reciprocity_absolute_tolerance_ohm&quot;:1e-10,&quot;similarity_factor_limit&quot;:2,&quot;similarity_is_screening_not_theorem&quot;:true,&quot;point_model&quot;:&quot;surface disc, diameter 5 mm&quot;,&quot;ring_model&quot;:&quot;circumferential cuff, inner diameter equals local arm diameter, axial width 5 mm&quot;,&quot;wide_cuff_model&quot;:&quot;circumferential cuff whose surface contact area equals pi*R^2; not an internal cross-section electrode&quot;,&quot;wide_cuff_nominal_width_mm&quot;:15,&quot;cross_section_plane_model&quot;:&quot;ideal zero-thickness internal cross-sectional surface; represented by shared mesh faces without removing tissue elements; mesh-conforming surface is slightly jagged and is not attachable&quot;,&quot;cross_section_plane_nominal_thickness_mm&quot;:0,&quot;cross_section_plane_realised_x_span_mm_range&quot;:[2.037296042361703,2.2586723572756],&quot;cross_section_plane_area_ratio_range&quot;:[1.5662932949793873,1.6335097127985911],&quot;cross_section_plane_projected_area_ratio_range&quot;:[1.0108998909934421,1.0170473959475035],&quot;mesh_file&quot;:&quot;output/accepted_arm_parameter_mesh.msh&quot;,&quot;frequency_hz&quot;:50000,&quot;contact_impedance_ohm_m2&quot;:0.00015915494309189532,&quot;current_ampere&quot;:1,&quot;complex_permittivity_used&quot;:false,&quot;model_domain&quot;:&quot;full body volume with soft-tissue background and available lungs, whole-heart and cortical-bone STL masks&quot;,&quot;tissue_assignment_method&quot;:&quot;tetrahedron-centroid classification by closed STL masks; a missing optional mask retains the previous/background class&quot;,&quot;tissues&quot;:[{&quot;name&quot;:&quot;soft_tissue&quot;,&quot;sigma_s_per_m&quot;:0.21149810344548203,&quot;rho_ohm_m&quot;:4.728174786010649,&quot;source&quot;:&quot;Nik solution clouds / historical MATLAB-Python model calculations&quot;,&quot;mask_available&quot;:true,&quot;assigned_elements&quot;:4342549.0},{&quot;name&quot;:&quot;lungs&quot;,&quot;sigma_s_per_m&quot;:0.057449143146029974,&quot;rho_ohm_m&quot;:17.4067,&quot;source&quot;:&quot;own_solution_cloud&quot;,&quot;mask_available&quot;:true,&quot;assigned_elements&quot;:11856},{&quot;name&quot;:&quot;heart&quot;,&quot;sigma_s_per_m&quot;:0.19543524171093257,&quot;rho_ohm_m&quot;:5.116784420483874,&quot;source&quot;:&quot;Heart Muscle&quot;,&quot;mask_available&quot;:true,&quot;assigned_elements&quot;:1963},{&quot;name&quot;:&quot;bones&quot;,&quot;sigma_s_per_m&quot;:0.020641911403089824,&quot;rho_ohm_m&quot;:48.44512605796346,&quot;source&quot;:&quot;Bone (Cortical)&quot;,&quot;mask_available&quot;:true,&quot;assigned_elements&quot;:2457},{&quot;name&quot;:&quot;blood&quot;,&quot;sigma_s_per_m&quot;:0.7008009874665541,&quot;rho_ohm_m&quot;:1.4269386286327477,&quot;source&quot;:&quot;Blood&quot;,&quot;mask_available&quot;:false,&quot;assigned_elements&quot;:0}],&quot;all_reciprocity_pass&quot;:true,&quot;timings&quot;:{&quot;mesh&quot;:{&quot;mesh_seconds&quot;:0.5735684,&quot;boundary_seconds&quot;:2.6457881,&quot;electrode_seconds&quot;:0.6568902},&quot;assignment_seconds&quot;:106.3442063,&quot;total_seconds&quot;:977.9881499}}};
  const stage = root.querySelector(&#x27;[data-stage]&#x27;);
  const token = name =&gt; {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.color = `var(${name})`;
    probe.style.display = &#x27;none&#x27;;
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  };
  const colourTokens = {
    I_plus: token(&#x27;--viz-series-1&#x27;),
    V_plus: token(&#x27;--viz-series-2&#x27;),
    V_minus: token(&#x27;--viz-series-3&#x27;),
    I_minus: token(&#x27;--viz-series-4&#x27;)
  };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 4000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.screenSpacePanning = true;

  const bodyGeometry = new THREE.BufferGeometry();
  bodyGeometry.setAttribute(&#x27;position&#x27;, new THREE.Float32BufferAttribute(DATA.mesh.vertices, 3));
  bodyGeometry.setIndex(DATA.mesh.faces);
  bodyGeometry.computeVertexNormals();
  bodyGeometry.computeBoundingBox();

  const bodyMaterial = new THREE.MeshPhongMaterial({
    color: new THREE.Color(token(&#x27;--muted-foreground&#x27;)),
    transparent: true,
    opacity: 0.32,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
  scene.add(body);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(bodyGeometry, 28),
    new THREE.LineBasicMaterial({ color: new THREE.Color(token(&#x27;--border&#x27;)), transparent: true, opacity: 0.20 })
  );
  scene.add(edges);

  scene.add(new THREE.AmbientLight(new THREE.Color(token(&#x27;--foreground&#x27;)), 0.72));
  const keyLight = new THREE.DirectionalLight(new THREE.Color(token(&#x27;--foreground&#x27;)), 1.15);
  keyLight.position.set(0, -350, 500);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(new THREE.Color(token(&#x27;--muted-foreground&#x27;)), 0.55);
  fillLight.position.set(0, 400, 120);
  scene.add(fillLight);

  const electrodeGroup = new THREE.Group();
  scene.add(electrodeGroup);
  const defaultView = { position: new THREE.Vector3(0, -760, 560), target: new THREE.Vector3(0, 0, -85) };

  function setCamera(position, target) {
    camera.position.copy(position);
    controls.target.copy(target);
    controls.update();
  }
  setCamera(defaultView.position, defaultView.target);

  const fields = {
    inner: root.querySelector(&#x27;[data-field=&quot;inner&quot;]&#x27;),
    outer: root.querySelector(&#x27;[data-field=&quot;outer&quot;]&#x27;),
    kind: root.querySelector(&#x27;[data-field=&quot;kind&quot;]&#x27;)
  };
  const kindLabels = {
    point_disc_5mm: &#x27;диск 5 мм&#x27;,
    circumferential_ring: &#x27;кольцо шириной 5 мм&#x27;,
    wide_cuff_equivalent_area: &#x27;широкая манжета 15 мм&#x27;,
    cross_section_plane: &#x27;идеальная плоскость-срез&#x27;
  };
  const tissueLabels = {
    soft_tissue: &#x27;мягкие ткани (фон)&#x27;,
    lungs: &#x27;лёгкие&#x27;,
    heart: &#x27;сердце целиком&#x27;,
    bones: &#x27;кортикальная кость&#x27;,
    blood: &#x27;кровь (не назначена)&#x27;
  };

  function disposeGroup(group) {
    while (group.children.length) {
      const child = group.children.pop();
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    }
  }

  function makeElectrode(row) {
    let geometry;
    if (row.kind === &#x27;point_disc_5mm&#x27;) {
      geometry = new THREE.CylinderGeometry(2.5, 2.5, 1.2, 32);
      geometry.rotateX(Math.PI / 2);
    } else if (row.kind === &#x27;cross_section_plane&#x27;) {
      // The 0.8-mm thickness is only a browser-visibility aid. The FEM target is zero thickness.
      geometry = new THREE.CylinderGeometry(30, 30, 0.8, 64);
      geometry.rotateZ(Math.PI / 2);
    } else {
      const width = Math.max(1, row.xmax - row.xmin);
      geometry = new THREE.CylinderGeometry(30.8, 30.8, width, 64, 1, true);
      geometry.rotateZ(Math.PI / 2);
    }
    const material = new THREE.MeshPhongMaterial({
      color: new THREE.Color(colourTokens[row.role]),
      emissive: new THREE.Color(colourTokens[row.role]),
      emissiveIntensity: 0.18,
      side: THREE.DoubleSide,
      transparent: row.kind === &#x27;cross_section_plane&#x27;,
      opacity: row.kind === &#x27;cross_section_plane&#x27; ? 0.78 : 1
    });
    const mesh = new THREE.Mesh(geometry, material);
    if (row.kind === &#x27;point_disc_5mm&#x27;) {
      mesh.position.set(row.x, row.y, row.z + 0.55);
    } else if (row.kind === &#x27;cross_section_plane&#x27;) {
      mesh.position.set(row.xcentroid, row.y, row.z);
    } else {
      mesh.position.set(row.xcentroid, row.y, row.z - 30.0);
    }
    mesh.userData = row;
    return mesh;
  }

  function keyFor(inner, outer, kind) { return `${inner}|${outer}|${kind}`; }
  function currentSelection() {
    return {
      inner: Number(fields.inner.value),
      outer: Number(fields.outer.value),
      kind: fields.kind.value
    };
  }
  function mean(values) { return values.reduce((sum, value) =&gt; sum + value, 0) / values.length; }

  function geometryDetail(kind, patches) {
    if (kind === &#x27;point_disc_5mm&#x27;) return &#x27;Номинальный диаметр поверхностного диска — 5 мм.&#x27;;
    if (kind === &#x27;circumferential_ring&#x27;) {
      const widths = patches.map(row =&gt; row.xmax - row.xmin);
      return `Кольцевой контакт охватывает руку по окружности; номинальная ширина 5 мм, средняя ширина по сетке ${mean(widths).toFixed(3)} мм.`;
    }
    if (kind === &#x27;wide_cuff_equivalent_area&#x27;) {
      const widths = patches.map(row =&gt; row.xmax - row.xmin);
      return `Манжета охватывает руку по окружности. Номинальная ширина 15 мм; средняя ширина выделенного участка сетки ${mean(widths).toFixed(3)} мм.`;
    }
    const spans = patches.map(row =&gt; row.xmax - row.xmin);
    const projected = patches.map(row =&gt; row.projectedAreaRatio);
    return `Математическая поверхность имеет нулевую толщину и площадь πR². В браузере добавлена толщина 0,8 мм только для видимости. В сетке поверхность представлена общими гранями тетраэдров: средний разброс по x ${mean(spans).toFixed(3)} мм, среднее отношение проекционной площади к πR² ${mean(projected).toFixed(4)}.`;
  }

  function update() {
    const selection = currentSelection();
    const key = keyFor(selection.inner, selection.outer, selection.kind);
    const result = DATA.results.find(row =&gt; row.key === key);
    const patches = DATA.patches.filter(row =&gt; row.key === key);
    disposeGroup(electrodeGroup);
    patches.forEach(row =&gt; electrodeGroup.add(makeElectrode(row)));

    root.querySelector(&#x27;[data-z-direct]&#x27;).textContent = result.zDirect.toFixed(6);
    root.querySelector(&#x27;[data-z-reciprocal]&#x27;).textContent = result.zReciprocal.toFixed(6);
    root.querySelector(&#x27;[data-z-error]&#x27;).textContent = result.reciprocityError.toExponential(3);
    root.querySelector(&#x27;[data-detail]&#x27;).textContent = `${selection.inner} мм от туловища · ${selection.outer} мм между внутренним и наружным электродами · ${kindLabels[selection.kind]} · |Z| = ${result.zAbs.toFixed(6)} Ом. ${geometryDetail(selection.kind, patches)}`;
    root.querySelectorAll(&#x27;tbody[data-results] tr&#x27;).forEach(tr =&gt; tr.classList.toggle(&#x27;is-selected&#x27;, tr.dataset.key === key));
  }

  const tbody = root.querySelector(&#x27;[data-results]&#x27;);
  DATA.results.forEach(row =&gt; {
    const tr = document.createElement(&#x27;tr&#x27;);
    tr.dataset.key = row.key;
    tr.innerHTML = `&lt;td&gt;${row.inner} мм&lt;/td&gt;&lt;td&gt;${row.outer} мм&lt;/td&gt;&lt;td&gt;${kindLabels[row.kind]}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row.zDirect.toFixed(6)}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row.zReciprocal.toFixed(6)}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row.reciprocityError.toExponential(3)}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${row.ratio.toFixed(6)}&lt;/td&gt;`;
    tr.addEventListener(&#x27;click&#x27;, () =&gt; {
      fields.inner.value = String(row.inner);
      fields.outer.value = String(row.outer);
      fields.kind.value = row.kind;
      update();
    });
    tbody.appendChild(tr);
  });

  const setup = [
    [&#x27;Частота&#x27;, `${(DATA.contract.frequency_hz / 1000).toFixed(0)} кГц`],
    [&#x27;Ток&#x27;, `${DATA.contract.current_ampere} А (линейная нормировка)`],
    [&#x27;Контактный импеданс&#x27;, `${DATA.contract.contact_impedance_ohm_m2.toExponential(6)} Ом·м²`],
    [&#x27;Расчётная сетка&#x27;, &#x27;4 358 825 тетраэдров&#x27;]
  ];
  const setupRoot = root.querySelector(&#x27;[data-setup]&#x27;);
  setup.forEach(([label, value]) =&gt; {
    const item = document.createElement(&#x27;div&#x27;);
    item.className = &#x27;setup-item&#x27;;
    item.innerHTML = `&lt;span class=&quot;text-small text-muted&quot;&gt;${label}&lt;/span&gt;&lt;strong&gt;${value}&lt;/strong&gt;`;
    setupRoot.appendChild(item);
  });

  const tissueBody = root.querySelector(&#x27;[data-tissues]&#x27;);
  DATA.contract.tissues.forEach(tissue =&gt; {
    const tr = document.createElement(&#x27;tr&#x27;);
    const mask = tissue.mask_available ? &#x27;есть&#x27; : &#x27;нет&#x27;;
    tr.innerHTML = `&lt;td&gt;${tissueLabels[tissue.name] || tissue.name}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${tissue.sigma_s_per_m.toFixed(6)}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${tissue.rho_ohm_m.toFixed(6)}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${Number(tissue.assigned_elements).toLocaleString(&#x27;ru-RU&#x27;)}&lt;/td&gt;&lt;td&gt;${mask}; ${tissue.source}&lt;/td&gt;`;
    tissueBody.appendChild(tr);
  });

  Object.values(fields).forEach(field =&gt; field.addEventListener(&#x27;change&#x27;, update));
  root.querySelector(&#x27;[data-action=&quot;reset&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setCamera(defaultView.position, defaultView.target));
  root.querySelector(&#x27;[data-action=&quot;top&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setCamera(new THREE.Vector3(0, 0, 790), new THREE.Vector3(0, 0, -80)));

  function resize() {
    const width = Math.max(320, stage.clientWidth);
    const height = Math.max(360, stage.clientHeight);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  update();

  function animate() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
})();
&lt;/script&gt;

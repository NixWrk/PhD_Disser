<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="875" viewBox="0 0 1500 875"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#34516a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="750" y="65" font-size="37" text-anchor="middle" fill="#17212b">Схема аппроксимаций и преобразования одной опоры</text><g transform="translate(245 290)"><path d="M-105 15 C-125 -80 -35 -110 20 -80 C110 -90 132 -15 74 55 C25 120 -68 98 -105 15 Z" fill="#e8dce1" stroke="#763e54" stroke-width="4"/></g><circle cx="745" cy="290" r="102" fill="#e4eff6" stroke="#34516a" stroke-width="3"/><ellipse cx="1240" cy="290" rx="135" ry="80" fill="#e9f1e6" stroke="#59764d" stroke-width="4"/><text x="245" y="448" font-size="31" text-anchor="middle" fill="#17212b">Опорная область</text><text x="745" y="448" font-size="31" text-anchor="middle" fill="#17212b">Равновеликая сфера</text><text x="1240" y="448" font-size="31" text-anchor="middle" fill="#17212b">Равновеликий эллипсоид</text><text x="750" y="536" font-size="29" text-anchor="middle" fill="#17212b">Условные проекции: анатомический масштаб не задан</text><rect x="65" y="605" width="1370" height="220" fill="#f3f6f8" stroke="#8195a6" stroke-width="2"/><text x="750" y="665" font-size="40" text-anchor="middle" fill="#17212b">x = c₀ + d + s(X − c₀)</text><text x="750" y="725" font-size="40" text-anchor="middle" fill="#17212b">V = s³V₀</text><text x="750" y="783" font-size="29" text-anchor="middle" fill="#17212b">Масштаб s меняет объём; перенос d меняет положение</text></g></svg>
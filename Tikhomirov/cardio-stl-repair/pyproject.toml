[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-stl-repair"
version = "0.0.1"
description = "Python port of WolframMath-master / Project / RFFI.m: починка STL-сеток сердца."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tikhomirov / Kardio_respiratory_dudes" },
]
license = { text = "Proprietary" }
keywords = ["mesh", "stl", "heart", "morphology", "marching-cubes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
    "scikit-image>=0.20",
    "scipy>=1.10",
]

[project.optional-dependencies]
full = [
    "pyvista>=0.43",       # визуализация (verbose mode)
    "pymeshfix>=0.16",     # альтернативная починка дыр
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyter>=1.0",
]

[project.urls]
"WolframMath-source" = "../WolframMath-master/Kernel/Project/RFFI.m"
"Sibling-cardio-port" = "../cardio-model-py"

[project.scripts]
cardio-stl-repair = "cardio_stl_repair.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
